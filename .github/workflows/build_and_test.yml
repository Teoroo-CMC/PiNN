name: Build and Test
on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Image publish + docs deploy are a Teoroo-CMC/PiNN privilege, and only on
# master / version tags. Forks, PRs, and feature-branch pushes still *build*
# the CPU image (to catch a broken Dockerfile) but never log in or push.
# GPU images are not built here — NGC bases are too large for GHA, and there
# is no GPU runner. Build Dockerfile.gpu / Singularity.gpu locally or on the
# cluster. The second Docker Hub org job is CPU publish-only.

jobs:
  pytest:
    continue-on-error: ${{ matrix.experimental }}
    name: "PYtest (Py${{ matrix.py-version }}-TF${{ matrix.tf-version }}${{ matrix.experimental && '-exp' || '' }})"
    strategy:
      matrix:
        # TF 2.15 is the supported backend: the last release shipping
        # tf.estimator + the legacy Keras optimizers (both removed in 2.16) and
        # the window that supports recent (Hopper / sm_90) GPUs.
        py-version: ["3.9", "3.10", "3.11"]
        tf-version: ["2.15"]
        experimental: [false]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.py-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Cache regression test files
        uses: actions/cache@v5
        with:
          path: ~/.cache/pinn/regression
          key: ${{ hashFiles('tests/test_regression.py') }}
      - name: Install PiNN
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-doc.txt
          pip install 'tensorflow==${{ matrix.tf-version }}.*' 'numpy<2'
          pip install .
      - name: Test with pytest
        run: pytest --forked tests/
  build:
    name: Build docker (cpu)
    needs: pytest
    runs-on: ubuntu-latest
    env:
      PUSH_IMAGE: ${{ github.repository == 'Teoroo-CMC/PiNN' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Get Tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ env.PUSH_IMAGE == 'true' && format('{0}:{1}-cpu', secrets.DOCKERHUB_REPO, env.TAG) || format('pinn:{0}-cpu', env.TAG) }}
  build-cpu-to-new-org:
    name: Build docker (cpu) - new
    if: github.repository == 'Teoroo-CMC/PiNN' && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Get Tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.NEW_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEW_DOCKERHUB_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.NEW_DOCKERHUB_REPO }}:${{ env.TAG }}-cpu
  deploy-docs:
    name: Deploy docs
    # workflow_dispatch is allowed here so a deploy can be replayed by hand:
    # gh-pages is a single shared ref, and two master merges landing seconds
    # apart deploy in parallel, with the slower job's `mike deploy -p` rejected
    # as non-fast-forward. Waiting for a PR's docs deploy before merging the
    # next one avoids that; this is the repair path for when it happens anyway.
    if: github.repository == 'Teoroo-CMC/PiNN' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # see https://github.com/jimporter/mike/issues/28
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
          cache: "pip"
          cache-dependency-path: "requirements*.txt"
      - name: Install PiNN
        run: |
          pip install 'tensorflow==2.15.*' 'numpy<2'
          pip install -r requirements-dev.txt
          pip install -r requirements-doc.txt
          pip install .
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Deploy docs
        run: |
          mike deploy ${GITHUB_REF##*/} -b gh-pages -p
